<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Studio Aperture / Shutter Blade Graphics -->
  <g transform="translate(256, 256)">
    <!-- Outer Glow Ring -->
    <circle r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.3" filter="url(#glow)" />
    <circle r="148" fill="none" stroke="#27272a" stroke-width="3" stroke-dasharray="8 8" />

    <!-- Stylized Iconic "Z" aperture blade geometry -->
    <path d="M -90 -100 L 90 -100 L -30 20 L 90 20 L 90 100 L -90 100 L 30 -20 L -90 -20 Z" 
          fill="url(#primaryGrad)" 
          filter="url(#glow)" />
    
    <!-- Central Lens Pupil / Sparkle Accent -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" />
    <circle cx="0" cy="0" r="10" fill="url(#accentGrad)" />

    <!-- High Tech Corner Focus Brackets -->
    <path d="M -160 -110 L -160 -160 L -110 -160" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
    <path d="M 160 -110 L 160 -160 L 110 -160" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
    <path d="M -160 110 L -160 160 L -110 160" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
    <path d="M 160 110 L 160 160 L 110 160" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
